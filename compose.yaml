name: sayesaman-demo
x-app: &app
  image: sayesaman-marketplace:1.0.0
  environment: &environment
    DATABASE_URL: postgresql+psycopg://sayesaman:${DB_PASSWORD:?Run bootstrap first}@db:5432/sayesaman_demo
    APP_MODE: demo
    COOKIE_SECURE: 'false'
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: sayesaman
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run bootstrap first}
      POSTGRES_DB: sayesaman_demo
    volumes: [db_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U sayesaman -d sayesaman_demo']
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  migrate:
    <<: *app
    command: sh -c 'alembic upgrade head && python -m packages.domain.seed'
    restart: 'no'
    depends_on:
      db: {condition: service_healthy}
  api:
    <<: *app
    build:
      context: .
      dockerfile: infra/Dockerfile
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 20
  worker:
    <<: *app
    command: python -m services.worker.main
    depends_on:
      migrate: {condition: service_completed_successfully}
  web:
    image: nginx:1.28.0-alpine
    ports: ['127.0.0.1:8080:8080']
    volumes: ['./infra/nginx.conf:/etc/nginx/nginx.conf:ro']
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:8080/api/v1/health/ready']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
volumes:
  db_data:
